# Include only for the ClickHouse endpoint. Set $wotstat_query_upstream_host first.
client_max_body_size 10m;
proxy_pass http://wotstat_query_fill;
proxy_http_version 1.1;
proxy_set_header Connection '';
proxy_set_header Host $host;
proxy_set_header X-Wotstat-Query-Endpoint "$scheme://$host$uri";
proxy_set_header X-Wotstat-Query-Upstream-Host $wotstat_query_upstream_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 130s;
proxy_send_timeout 120s;
proxy_buffering on;

# Decode after cache lookup, without storing an extra identity variant.
gunzip on;
gzip_proxied any;
# responseHeaders adds Vary once, after cache lookup.
gzip_vary off;

proxy_cache wotstat_query_cache;
proxy_cache_methods GET HEAD POST;
# The verified hash already identifies the backend, SQL, parameters and policy.
# The suffix separates the stored gzip representation from old Brotli entries.
proxy_cache_key "wotstat-clickhouse|$http_authorization|$http_x_wotstat_query_cache_key|gzip";
proxy_cache_bypass $wotstat_query_bypass;
proxy_no_cache $wotstat_query_bypass $wotstat_query_no_store;
# Lifetime comes exclusively from the verified internal response's X-Accel-Expires.
proxy_cache_valid 0;
proxy_cache_use_stale off;
proxy_cache_background_update off;
proxy_cache_revalidate off;
proxy_cache_lock on;
proxy_cache_lock_timeout 130s;
proxy_cache_lock_age 130s;

proxy_hide_header X-Wotstat-Query-Cache-Verified;
proxy_hide_header X-Wotstat-Query-Cache-Created;
proxy_hide_header X-Wotstat-Query-Cache-Expires;
js_header_filter queryCache.responseHeaders;
