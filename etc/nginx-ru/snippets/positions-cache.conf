# The main server supplies one Cache-Control policy for every positions alias.
proxy_cache wotstat_cache_positions;
proxy_cache_key "$scheme$request_method$host$request_uri";
proxy_cache_bypass $positions_api_request $is_websocket;
proxy_no_cache $positions_api_request $is_websocket;
proxy_cache_use_stale off;
proxy_cache_background_update off;
proxy_cache_lock on;

# Preserve the origin date so a HIT does not restart the browser's max-age.
proxy_pass_header Date;
add_header X-Cache-Status $upstream_cache_status always;
