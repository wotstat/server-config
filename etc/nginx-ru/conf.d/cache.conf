# Existing RU-1 cache paths and limits; use the same definitions on RU-2.
# Install as a replacement for existing definitions, never alongside duplicates.
proxy_cache_path /var/cache/nginx/wotstat/main
  levels=1:2 keys_zone=wotstat_cache_main:20m inactive=30d max_size=5g;
proxy_cache_path /var/cache/nginx/wotstat/static
  levels=1:2 keys_zone=wotstat_cache_static:20m inactive=30d max_size=10g;
proxy_cache_path /var/cache/nginx/wotstat/cef-storage
  levels=1:2 keys_zone=wotstat_cache_cef_storage:20m inactive=30d max_size=10g;
proxy_cache_path /var/cache/nginx/wotstat/positions
  levels=1:2 keys_zone=wotstat_cache_positions:20m inactive=30d max_size=10g;
proxy_cache_path /var/cache/nginx/wotstat/widgets
  levels=1:2 keys_zone=wotstat_cache_widgets:20m inactive=30d max_size=10g;
proxy_cache_path /var/cache/nginx/wotstat/shared
  levels=1:2 keys_zone=wotstat_cache_shared:20m inactive=30d max_size=10g;
