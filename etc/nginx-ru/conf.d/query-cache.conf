# Requires ngx_http_js_module. Load the module once in nginx.conf (main context).
js_engine qjs;
js_import queryCache from /etc/nginx/njs/query-cache.js;
js_set $wotstat_query_bypass queryCache.bypass;
js_var $wotstat_query_expires '';

# Keep popular dated results for their requested TTL; discard unused ones after a day.
proxy_cache_path /var/cache/nginx/wotstat-query levels=1:2
  keys_zone=wotstat_query_cache:32m max_size=10g inactive=1d use_temp_path=off;

map $upstream_http_x_wotstat_query_cache_verified $wotstat_query_no_store {
  default 1;
  '1' 0;
}

upstream wotstat_query_fill {
  server unix:/run/nginx-query-fill.sock;
  keepalive 16;
}

# Internal second pass in the same nginx, not a separate service or public endpoint.
# Only misses and bypassed requests reach it; response bodies stay in nginx.
server {
  listen unix:/run/nginx-query-fill.sock;
  server_name query-fill;
  client_max_body_size 10m;
  client_body_buffer_size 10m;
  access_log off;

  location / {
    js_content queryCache.verify;
  }

  location @query_origin {
    proxy_pass https://$main_server_ip$request_uri;
    proxy_cache off;
    gzip off;
    gunzip off;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_ssl_server_name on;
    proxy_ssl_name $http_x_wotstat_query_upstream_host;
    proxy_set_header Host $http_x_wotstat_query_upstream_host;
    # Match the Cloudflare route; the main cache returns gzip.
    proxy_set_header Accept-Encoding 'gzip, br';
    proxy_set_header CF-Connecting-IP $http_x_real_ip;
    proxy_set_header X-Real-IP $http_x_real_ip;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    # Preserve the public endpoint for the main cache's hash verification.
    # Its public listener already overwrote any client-supplied value.
    proxy_set_header X-Wotstat-Query-Endpoint $http_x_wotstat_query_endpoint;
    proxy_set_header X-Wotstat-Query-Upstream-Host '';
    proxy_connect_timeout 40s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    js_header_filter queryCache.prepareFill;
  }
}
