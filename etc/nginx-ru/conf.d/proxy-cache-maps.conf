# Shared by the ru.*.wotstat.info and *.mtstat.info service proxies.
map $http_upgrade $is_websocket {
  default 0;
  websocket 1;
}

map $http_upgrade $connection_upgrade {
  default close;
  websocket upgrade;
}

map $upstream_http_cache_control $do_not_store {
  default 1;
  "~*no-store" 1;
  "~*no-cache" 1;
  "~*private" 1;
  "~*max-age\s*=\s*[1-9]\d*" 0;
  "~*s-maxage\s*=\s*[1-9]\d*" 0;
}

map "$upstream_cache_status:$do_not_store" $x_cache_status_pretty {
  "~^MISS:1$" "DYNAMIC";
  "~^HIT:0$" "HIT";
  "~^MISS:0$" "MISS";
  "~^BYPASS:" "BYPASS";
  "~^EXPIRED:" "EXPIRED";
  "~^STALE:" "STALE";
  "~^UPDATING:" "UPDATING";
  "~^REVALIDATED:" "REVALIDATED";
  default "UNKNOWN";
}
