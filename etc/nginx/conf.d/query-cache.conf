# Requires ngx_http_js_module, loaded once in nginx.conf (main context).
js_engine qjs;
js_import queryCache from /etc/nginx/njs/query-cache.js;
js_set $wotstat_query_bypass queryCache.bypass;
js_var $wotstat_query_expires '';

# Use the TCP peer BEFORE real_ip_header replaces it with the end user's IP.
# Keep the RU address in sync with my-proxy-realip.conf.
geo $realip_remote_addr $wotstat_query_trusted_proxy {
  default 0;
  195.225.110.24 1;
  127.0.0.1 1;
  ::1 1;
}

# A public caller cannot supply another endpoint to inspect/fill its cache.
# Both the RU hop and the local wotstat.info -> db.wotstat.info hop preserve it.
map "$wotstat_query_trusted_proxy:$http_x_wotstat_query_endpoint" $wotstat_query_endpoint {
  default "$scheme://$host$uri";
  "~^1:https?://(?:ru\.)?wotstat\.info/api/db/$" $http_x_wotstat_query_endpoint;
  "~^1:https?://(?:ru\.)?db\.wotstat\.info/$" $http_x_wotstat_query_endpoint;
}

proxy_cache_path /var/cache/nginx/wotstat-query levels=1:2
  keys_zone=wotstat_query_cache:32m max_size=10g inactive=1d use_temp_path=off;

map $upstream_http_x_wotstat_query_cache_verified $wotstat_query_no_store {
  default 1;
  '1' 0;
}

upstream wotstat_query_fill {
  server unix:/run/nginx-query-fill.sock;
  keepalive 16;
}

server {
  listen unix:/run/nginx-query-fill.sock;
  server_name query-fill;
  client_max_body_size 10m;
  client_body_buffer_size 10m;
  access_log off;

  location / {
    js_content queryCache.verify;
  }

  location @query_origin {
    proxy_pass http://clickhouse_http;
    proxy_cache off;
    gzip off;
    gunzip off;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host db.wotstat.info;
    # Store one encoding; the public location decodes it when necessary.
    proxy_set_header Accept-Encoding gzip;
    proxy_set_header X-Real-IP $http_x_real_ip;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Wotstat-Query-Endpoint '';
    proxy_connect_timeout 40s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    js_header_filter queryCache.prepareFill;
  }
}
