# RU-домен принимаем только от IP прокси, до подстановки IP посетителя.
map "$realip_remote_addr:$http_x_forwarded_host" $wotstat_meta_host {
    default $server_name;
    "195.225.110.24:ru.wotstat.info" ru.wotstat.info;
    "195.225.110.24:ru.og.wotstat.info" ru.og.wotstat.info;
    "185.221.199.41:ru.wotstat.info" ru.wotstat.info;
    "185.221.199.41:ru.og.wotstat.info" ru.og.wotstat.info;
}

# Общий кэш HTML и OG; TTL приходит из Cache-Control бэкенда.
proxy_cache_path /data/nginx-cache/wotstat-meta levels=1:2 keys_zone=wotstat_meta:10m
    max_size=1g inactive=7d use_temp_path=off;
